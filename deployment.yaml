apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubedemoappp-deployment
spec:
  replicas: 4
  selector:
    matchLabels:
      app: kubedemoappp
  template:
    metadata:
      labels:
        app: kubedemoappp
    spec:
      containers:
        - name: kubedemoappp
          image: nihaaaa34/sample:kubeimage12
          ports:
            - containerPort: 5000